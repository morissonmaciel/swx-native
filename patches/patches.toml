# patches/patches.toml — ordered patch stack with scope.
# apply_patches.py applies entries with enabled = true whose games/platforms
# match --game/--platform. Order = application order (a later patch may depend
# on an earlier one's context). Replaces the old `series` flat list.
# Scope rules:
#   games = ["*"]  host mechanism, game-agnostic (profile supplies per-game data)
#   games = ["<title id>", ...]  touches that game's builds/addresses/stubs
#   platforms      OS the code runs on (mac and/or ios)
#   default        effective default in a managed install (optional; absent = off/experimental)

[[patch]]
path = "SWX_GPU_KEEPALIVE/nvn_mtl.m.patch"
enabled = true
flag = "SWX_GPU_KEEPALIVE"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }

[[patch]]
path = "SWX_GPU_TEXTURE_POOL/nvn_mtl.m.patch"
enabled = false
flag = "SWX_GPU_TEXTURE_POOL"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "off", ios = "off" }
note = "disabled for control A/B (was: install default mac on)"

[[patch]]
path = "SWX_GPU_KEEPALIVE/swx_keepalive.m.patch"
enabled = true
flag = "SWX_GPU_KEEPALIVE"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }

[[patch]]
path = "SWX_GPU_KEEPALIVE/hle_nvn.c.patch"
enabled = true
flag = "SWX_GPU_KEEPALIVE"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }

