# ---- SWX_VFR group (fourth umbrella; applies after SWX_GPU_KEEPALIVE, SWX_NATIVE_RES and SWX_FIDELITYFX_CAS) ----
# Display pacing + real-time game step. SWX_VFR=relaxed/uncapped arms the VFR
# clock, which isolates the stock DM_FPS/DM_FPS_TARGET/DM_FPS_HOLD path
# (fstep_tick not called; dm_fps_state +0 stays neutral). SWX_VFR=0 restores
# stock. Order: framepace -> present_worker -> queue_policy (host mechanisms
# stacking on nvn_mtl.m/hle_nvn.c), then ratio_load_fix (BOTW patches.py).
# The launcher exports SWX_VFR=relaxed SWX_VFR_HZ=auto.
# See docs/vfr_framepace.md; gates #6/#11/#12/#10 in PATCHES.md.
#
# BLOCKED (enabled = false): the current core rewrote the display-link callback
# (nvn_mtl.m ~20520+) with a late latch (nvn_link_latch.h), a drain
# (nvn_link_drain.h), tick-based holds (hold_ticks/tick_period) and a new
# present history / present_now signature. framepace's display-link integration
# (and the worker/policy that stack on it) targets the OLD period-based path
# and no longer applies: 15 hunks drift structurally across nvn_mtl.m,
# hle_nvn.c, loader.c, front_mac.m. The VFR clock/isolation design is intact;
# the present path must be re-engineered against the latch/drain/tick core and
# re-gated in gameplay before enabling. The .command keeps DM_FPS* until then.

[[patch]]
path = "SWX_VFR/framepace.patch"
enabled = false
flag = "SWX_VFR"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }
note = "blocked: display-link integration needs rebase onto latch/drain/tick core"

[[patch]]
path = "SWX_VFR/present_worker.patch"
enabled = false
flag = "SWX_VFR"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }
note = "blocked: stacks on framepace present path"

[[patch]]
path = "SWX_VFR/queue_policy.patch"
enabled = false
flag = "SWX_VFR"
games = ["*"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }
note = "blocked: stacks on framepace/worker present path"

[[patch]]
path = "SWX_VFR/ratio_load_fix.patch"
enabled = false
flag = "SWX_VFR"
games = ["01007EF00011E000"]
platforms = ["mac", "ios"]
default = { mac = "on", ios = "off" }
note = "applies clean; held with the group until the present path is rebased"

